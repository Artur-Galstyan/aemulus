[package]
name = "aemulus-servers"
description = "Device servers for aemulus (early work in progress)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true }
aemulus-proto = { version = "0.0.3", path = "../aemulus-proto" }
clap = { version = "4.6.9", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.9", features = ["gzip"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.3", features = ["v4"] }
