[package]
name = "aemulus"
description = "A digital twin for lab automation (early work in progress)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aemulus-servers = { version = "0.0.3", path = "../aemulus-servers" }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"


[lib]
crate-type = ["cdylib"]
