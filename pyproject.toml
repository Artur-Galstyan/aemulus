[project]
name = "aemulus"
version = "0.0.3"
description = "A digital twin for lab automation (early work in progress)"
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
authors = [
    { name = "Artur Galstyan", email = "63471891+Artur-Galstyan@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "connectrpc>=0.13.0",
    "hypercorn>=0.18.0",
    "jaxtyping>=0.3.11",
    "loguru>=0.8.0",
    "protobuf-py>=0.7.0",
    "typed-mujoco",
]


[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/aemulus/Cargo.toml"
python-source = "python"
module-name = "aemulus._rust._native"


[dependency-groups]
dev = [
    "buf-bin>=1.75.0",
    "protoc-gen-connectrpc>=0.13.0",
    "protoc-gen-py>=0.7.0",
]
