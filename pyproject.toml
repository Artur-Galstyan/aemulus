[project]
name = "aemulus"
version = "0.0.2"
description = "A digital twin for lab automation (early work in progress)"
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
authors = [
    { name = "Artur Galstyan", email = "63471891+Artur-Galstyan@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "connectrpc>=0.13.0",
    "hypercorn>=0.18.0",
    "loguru>=0.8.0",
    "protobuf-py>=0.7.0",
    "typed-mujoco",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "python"

[dependency-groups]
dev = [
    "buf-bin>=1.75.0",
    "protoc-gen-connectrpc>=0.13.0",
    "protoc-gen-py>=0.7.0",
]
