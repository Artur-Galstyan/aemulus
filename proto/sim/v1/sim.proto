syntax = "proto3";

package aemulus.sim.v1;

message GetJointRequest {
  string joint = 1;
}

message GetJointResponse {
  double position = 1;
  double velocity = 2;
}

message SetActuatorRequest {
  string actuator = 1;
  double value = 2;
}

message SetActuatorResponse {}

message StreamStateRequest {}

message StreamStateResponse {
  repeated double qpos = 1;
}

message GetModelRequest {}

message GetModelResponse {
  string xml = 1;
  map<string, bytes> meshes = 2;
}

service SimService {
  rpc GetJoint(GetJointRequest) returns (GetJointResponse);
  rpc SetActuator(SetActuatorRequest) returns (SetActuatorResponse);
  rpc StreamState(StreamStateRequest) returns (stream StreamStateResponse);
  rpc GetModel(GetModelRequest) returns (GetModelResponse);
}
