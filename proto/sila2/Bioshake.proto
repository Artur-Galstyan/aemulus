syntax = "proto3";

import "sila2/SiLAFramework.proto";

package sila2.dev.arturgalstyan.shakers.bioshake.v1;

/* Controls a BioShake 3000 elm orbital shaker. */
service Bioshake {
  /* Starts to shake at a speed. */
  rpc StartShaking (sila2.dev.arturgalstyan.shakers.bioshake.v1.StartShaking_Parameters) returns (sila2.dev.arturgalstyan.shakers.bioshake.v1.StartShaking_Responses) {}
  /* Stops the shaking. */
  rpc StopShaking (sila2.dev.arturgalstyan.shakers.bioshake.v1.StopShaking_Parameters) returns (sila2.dev.arturgalstyan.shakers.bioshake.v1.StopShaking_Responses) {}
  /* Closes the edge locking mechanism to hold the microplate. */
  rpc LockPlate (sila2.dev.arturgalstyan.shakers.bioshake.v1.LockPlate_Parameters) returns (sila2.dev.arturgalstyan.shakers.bioshake.v1.LockPlate_Responses) {}
  /* Opens the edge locking mechanism to release the microplate. */
  rpc UnlockPlate (sila2.dev.arturgalstyan.shakers.bioshake.v1.UnlockPlate_Parameters) returns (sila2.dev.arturgalstyan.shakers.bioshake.v1.UnlockPlate_Responses) {}
  /* The current speed in rpm. */
  rpc Subscribe_Speed (sila2.dev.arturgalstyan.shakers.bioshake.v1.Subscribe_Speed_Parameters) returns (stream sila2.dev.arturgalstyan.shakers.bioshake.v1.Subscribe_Speed_Responses) {}
  /* True when the edge locking mechanism holds the microplate. */
  rpc Subscribe_PlateLocked (sila2.dev.arturgalstyan.shakers.bioshake.v1.Subscribe_PlateLocked_Parameters) returns (stream sila2.dev.arturgalstyan.shakers.bioshake.v1.Subscribe_PlateLocked_Responses) {}
}

/* Parameters for StartShaking */
message StartShaking_Parameters {
  sila2.org.silastandard.Integer Speed = 1;  /* The target speed in rpm. */
}

/* Responses of StartShaking */
message StartShaking_Responses {
}

/* Parameters for StopShaking */
message StopShaking_Parameters {
}

/* Responses of StopShaking */
message StopShaking_Responses {
}

/* Parameters for LockPlate */
message LockPlate_Parameters {
}

/* Responses of LockPlate */
message LockPlate_Responses {
}

/* Parameters for UnlockPlate */
message UnlockPlate_Parameters {
}

/* Responses of UnlockPlate */
message UnlockPlate_Responses {
}

/* Parameters for Speed */
message Subscribe_Speed_Parameters {
}

/* Responses of Speed */
message Subscribe_Speed_Responses {
  sila2.org.silastandard.Real Speed = 1;  /* The current speed in rpm. */
}

/* Parameters for PlateLocked */
message Subscribe_PlateLocked_Parameters {
}

/* Responses of PlateLocked */
message Subscribe_PlateLocked_Responses {
  sila2.org.silastandard.Boolean PlateLocked = 1;  /* True when the edge locking mechanism holds the microplate. */
}
