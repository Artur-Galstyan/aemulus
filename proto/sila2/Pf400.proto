syntax = "proto3";

import "sila2/SiLAFramework.proto";

package sila2.dev.arturgalstyan.robots.pf400.v1;

/* Controls a PF400 robot arm. */
service Pf400 {
  /* Moves the Z axis to a height. */
  rpc MoveZ (sila2.dev.arturgalstyan.robots.pf400.v1.MoveZ_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveZ */
  rpc MoveZ_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveZ */
  rpc MoveZ_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.dev.arturgalstyan.robots.pf400.v1.MoveZ_Responses) {}
  /* Moves the shoulder to an angle. */
  rpc MoveShoulder (sila2.dev.arturgalstyan.robots.pf400.v1.MoveShoulder_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveShoulder */
  rpc MoveShoulder_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveShoulder */
  rpc MoveShoulder_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.dev.arturgalstyan.robots.pf400.v1.MoveShoulder_Responses) {}
  /* Moves the elbow to an angle. */
  rpc MoveElbow (sila2.dev.arturgalstyan.robots.pf400.v1.MoveElbow_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveElbow */
  rpc MoveElbow_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveElbow */
  rpc MoveElbow_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.dev.arturgalstyan.robots.pf400.v1.MoveElbow_Responses) {}
  /* Moves the wrist to an angle. */
  rpc MoveWrist (sila2.dev.arturgalstyan.robots.pf400.v1.MoveWrist_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveWrist */
  rpc MoveWrist_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveWrist */
  rpc MoveWrist_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.dev.arturgalstyan.robots.pf400.v1.MoveWrist_Responses) {}
  /* Moves the gripper fingers to a position. */
  rpc MoveGripper (sila2.dev.arturgalstyan.robots.pf400.v1.MoveGripper_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveGripper */
  rpc MoveGripper_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveGripper */
  rpc MoveGripper_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.dev.arturgalstyan.robots.pf400.v1.MoveGripper_Responses) {}
  /* The current height of the Z axis in meters. */
  rpc Subscribe_PositionZ (sila2.dev.arturgalstyan.robots.pf400.v1.Subscribe_PositionZ_Parameters) returns (stream sila2.dev.arturgalstyan.robots.pf400.v1.Subscribe_PositionZ_Responses) {}
}

/* Parameters for MoveZ */
message MoveZ_Parameters {
  sila2.org.silastandard.Real Height = 1;  /* The target height in meters. */
}

/* Responses of MoveZ */
message MoveZ_Responses {
}

/* Parameters for MoveShoulder */
message MoveShoulder_Parameters {
  sila2.org.silastandard.Real Angle = 1;  /* The target angle in radians. */
}

/* Responses of MoveShoulder */
message MoveShoulder_Responses {
}

/* Parameters for MoveElbow */
message MoveElbow_Parameters {
  sila2.org.silastandard.Real Angle = 1;  /* The target angle in radians. */
}

/* Responses of MoveElbow */
message MoveElbow_Responses {
}

/* Parameters for MoveWrist */
message MoveWrist_Parameters {
  sila2.org.silastandard.Real Angle = 1;  /* The target angle in radians. */
}

/* Responses of MoveWrist */
message MoveWrist_Responses {
}

/* Parameters for MoveGripper */
message MoveGripper_Parameters {
  sila2.org.silastandard.Real Position = 1;  /* The target finger displacement in meters. */
}

/* Responses of MoveGripper */
message MoveGripper_Responses {
}

/* Parameters for PositionZ */
message Subscribe_PositionZ_Parameters {
}

/* Responses of PositionZ */
message Subscribe_PositionZ_Responses {
  sila2.org.silastandard.Real PositionZ = 1;  /* The current height of the Z axis in meters. */
}
