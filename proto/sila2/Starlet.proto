syntax = "proto3";

import "sila2/SiLAFramework.proto";

package sila2.dev.arturgalstyan.robots.starlet.v1;

/* Controls a Hamilton Microlab STARlet liquid handler. */
service Starlet {
  /* Moves the X arm to a target position. */
  rpc MoveX (sila2.dev.arturgalstyan.robots.starlet.v1.MoveX_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveX */
  rpc MoveX_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveX */
  rpc MoveX_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.dev.arturgalstyan.robots.starlet.v1.MoveX_Responses) {}
  /* Moves a channel along the Y axis to a target position. */
  rpc MoveY (sila2.dev.arturgalstyan.robots.starlet.v1.MoveY_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveY */
  rpc MoveY_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveY */
  rpc MoveY_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.dev.arturgalstyan.robots.starlet.v1.MoveY_Responses) {}
  /* Moves a channel along the Z axis to a target position. */
  rpc MoveZ (sila2.dev.arturgalstyan.robots.starlet.v1.MoveZ_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveZ */
  rpc MoveZ_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveZ */
  rpc MoveZ_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.dev.arturgalstyan.robots.starlet.v1.MoveZ_Responses) {}
  /* Moves a channel plunger to a target position. */
  rpc MovePlunger (sila2.dev.arturgalstyan.robots.starlet.v1.MovePlunger_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MovePlunger */
  rpc MovePlunger_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MovePlunger */
  rpc MovePlunger_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.dev.arturgalstyan.robots.starlet.v1.MovePlunger_Responses) {}
  /* Moves a channel tip eject sleeve to a target position. */
  rpc MoveEject (sila2.dev.arturgalstyan.robots.starlet.v1.MoveEject_Parameters) returns (sila2.org.silastandard.CommandConfirmation) {}
  /* Monitor the state of MoveEject */
  rpc MoveEject_Info (sila2.org.silastandard.CommandExecutionUUID) returns (stream sila2.org.silastandard.ExecutionInfo) {}
  /* Retrieve result of MoveEject */
  rpc MoveEject_Result(sila2.org.silastandard.CommandExecutionUUID) returns (sila2.dev.arturgalstyan.robots.starlet.v1.MoveEject_Responses) {}
}

/* Parameters for MoveX */
message MoveX_Parameters {
  sila2.org.silastandard.Real Position = 1;  /* The target X arm position in meters. */
}

/* Responses of MoveX */
message MoveX_Responses {
}

/* Parameters for MoveY */
message MoveY_Parameters {
  sila2.org.silastandard.Integer Channel = 1;  /* The channel index (0 to 7). */
  sila2.org.silastandard.Real Position = 2;  /* The target Y position in meters. */
}

/* Responses of MoveY */
message MoveY_Responses {
}

/* Parameters for MoveZ */
message MoveZ_Parameters {
  sila2.org.silastandard.Integer Channel = 1;  /* The channel index (0 to 7). */
  sila2.org.silastandard.Real Position = 2;  /* The target Z position in meters. */
}

/* Responses of MoveZ */
message MoveZ_Responses {
}

/* Parameters for MovePlunger */
message MovePlunger_Parameters {
  sila2.org.silastandard.Integer Channel = 1;  /* The channel index (0 to 7). */
  sila2.org.silastandard.Real Position = 2;  /* The target plunger position in meters. */
}

/* Responses of MovePlunger */
message MovePlunger_Responses {
}

/* Parameters for MoveEject */
message MoveEject_Parameters {
  sila2.org.silastandard.Integer Channel = 1;  /* The channel index (0 to 7). */
  sila2.org.silastandard.Real Position = 2;  /* The target eject sleeve position in meters. */
}

/* Responses of MoveEject */
message MoveEject_Responses {
}
