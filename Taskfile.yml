# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  setup:
    desc: Install the code generator plugins
    cmds:
      - uv sync
      - cargo install protoc-gen-prost protoc-gen-tonic

  sila-base:
    desc: Get the official SiLA files (MIT) from sila_base
    vars:
      BASE: https://gitlab.com/SiLA2/sila_base/-/raw/master
    cmds:
      - mkdir -p xslt
      - for: [fdl2proto, fdl2proto-messages, fdl2proto-service, fdl-validation]
        cmd: curl -sfL {{.BASE}}/xslt/{{.ITEM}}.xsl -o xslt/{{.ITEM}}.xsl
      - mkdir -p proto/sila2
      - curl -sfL {{.BASE}}/protobuf/SiLAFramework.proto -o proto/sila2/SiLAFramework.proto

  gen:
    desc: Generate Python and Rust code from the proto directory
    cmds:
      - find proto/sila2 -name '*.proto' ! -name SiLAFramework.proto -delete
      - for f in features/*.sila.xml; do n=$(basename "$f"); xsltproc xslt/fdl2proto.xsl "$f" | sed 's|import "SiLAFramework.proto"|import "sila2/SiLAFramework.proto"|' > "proto/sila2/${n%%-*}.proto"; done
      - uv run buf generate
      - buf generate --template buf.gen.browser.yaml

  build:
    desc: Rebuild the Rust Python extension and verify the import
    cmds:
      - uv sync --reinstall-package aemulus
